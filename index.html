<!DOCTYPE html>
<html class="no-js">
<head>

<title>
HankkiTV Restaurant Map | Discover Restaurants Through YouTube
</title>


<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta
name="description"
content="Discover restaurants featured on HankkiTV with an interactive map and embedded YouTube videos.">

<meta property="og:type" content="website">

<meta property="og:title" content="HankkiTV Restaurants" id="ogTitle">

<meta property="og:description" content="Discover Korean restaurants with HankkiTV" id="ogDescription">

<meta property="og:image"
content="logo_t.png" id="ogImage">

<meta property="og:url" content="" id="ogUrl">

<meta name="twitter:card" content="summary_large_image">

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2563eb">

<link rel="preconnect"
href="https://www.youtube.com">

<link rel="preconnect"
href="https://i.ytimg.com">

<link rel="shortcut icon" href="favicon.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.0/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.1.0"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet"
href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css">
<link rel="stylesheet"
href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css">
<link rel="stylesheet"
href="https://unpkg.com/leaflet.zoomslider/src/L.Control.Zoomslider.css">

<script
src="https://unpkg.com/leaflet.zoomslider/src/L.Control.Zoomslider.js">
</script>
</head>

<body>
    <div id="appLoader">

    <div class="loaderBox">

        <img src="logo_t.png">

        <div id="loaderText">
            Loading map...
        </div>

        <div class="loaderBar">
            <div id="loaderProgress"></div>
        </div>

    </div>

</div>

<div id="map"></div>

<div class="search-container">

<div class="search-box">

<div class="search-icon">🔍</div>

<input
id="searchInput"
type="text"
placeholder="Search restaurants, cuisine, neighborhood..."
autocomplete="off">

<div id="clearSearch">✕</div>

</div>

</div>

<div id="searchResults">

    <div class="sheet-handle"></div>

    <div class="sheet-header">
        Restaurants
    </div>

    <div id="resultsList"></div>

</div>
<div id="restaurantDetails">

    <button id="closeDetails">
        ✕
    </button>


    <div id="detailContent">

    </div>

</div>

<div id="offlineBanner">

    Offline mode

</div>

<script src="js/preloader.js"></script>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/router.js"></script>
<script src="js/navigation.js"></script>
<script src="js/map.js"></script>
<script src="js/markers.js"></script>
<script src="js/storage.js"></script>
<script src="js/restaurants.js"></script>
<script src="js/details.js"></script>
<script src="js/location.js"></script>
<script src="js/filters.js"></script>
<script src="js/search.js"></script>

<script src="js/app.js"></script>
<script>
    function updateOnlineStatus(){


    document

    .getElementById(
        "offlineBanner"
    )

    .style.display =

        navigator.onLine
        ?
        "none"
        :
        "block";


}



window.addEventListener(
"online",
updateOnlineStatus
);


window.addEventListener(
"offline",
updateOnlineStatus
);


updateOnlineStatus();
</script>
</body>
</html>
